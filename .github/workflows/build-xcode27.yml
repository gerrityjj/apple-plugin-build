name: Build Apple plug-ins (Xcode 27)

on: workflow_dispatch

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Show the tools on this Mac
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          sw_vers
          python3 --version
          npm --version

      - name: Get Apple's plug-in code
        run: |
          git clone --depth 1 https://github.com/apple/unityplugins.git
          cd unityplugins && echo "Apple unityplugins commit: $(git rev-parse HEAD)"

      - name: Build Apple.Core and Apple.BackgroundAssets
        working-directory: unityplugins
        run: python3 -u build.py -p Core BackgroundAssets -m iOS macOS -bc Release -nc

      - name: List what was made
        working-directory: unityplugins
        run: find Build -name "*.tgz" -exec ls -la {} \;

      - name: Offer the files as a download
        uses: actions/upload-artifact@v4
        with:
          name: apple-unity-plugins
          path: unityplugins/Build/**/*.tgz
          if-no-files-found: error
